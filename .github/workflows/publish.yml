name: publish

# Trusted Publishing (OIDC) for the npm packages in this repo — no token anywhere.
# npm mints a short-lived credential from GitHub's OIDC identity for this exact
# workflow, and provenance is generated automatically.
#
# One-time setup on npmjs.com, per package (Package settings -> Trusted Publisher):
#   Publisher:        GitHub Actions
#   Organization:     PrivOS-AI
#   Repository:       privos-app-packages
#   Workflow filename: publish.yml
#   Environment:      release
#
# One workflow file is the trust root for every package below, so whoever can
# change it can publish any of them. The `release` environment is what bounds
# that: it only accepts runs from `main` and it holds each run for a human
# approval before the OIDC credential is ever minted.
# Configure it for every package in this repo: @privos_ai/agent-harness,
# @privos_ai/app-license, @privos_ai/app-react, @privos_ai/app-server and
# create-privos-mcp-app.
#
# Release flow: bump the package's version (committed), then run this workflow
# from the Actions tab, choosing the package. Publishing a version that already
# exists on npm fails loudly — bump first.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        required: true
        type: choice
        options:
          - agent-harness
          - app-license
          - app-react
          - app-server
          - create-privos-mcp-app

permissions:
  id-token: write # required for npm trusted publishing (OIDC) + provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gates the npm credential behind a reviewer and restricts the run to `main`.
    # Must match the Environment registered on npmjs for every package here —
    # changing one without the other breaks publishing.
    environment: release
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; ensure it regardless of the bundled version.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build --if-present
      - run: npm publish --access public
